[server]
bind = ":8080"
# require_api_key_env = "KYO_ROUTER_API_KEY"   # optional, enforced from M3

[connectors.opencode]
base_url = "https://opencode.ai/zen/go/v1"
api_key_env = "OPENCODE_GO_API_KEY"
session_header_mode = "request"   # request | fixed

[connectors.devin]
credentials_path = "/run/secrets/devin-credentials.toml"
api_key_env = "DEVIN_API_KEY"     # set = wins over the file; empty = use the file
base_url = ""                     # empty = use api_server_url from the file
jwt_refresh_margin = "60s"
ide_version = "3.2.23"
extension_version = "1.48.2"

[connectors.deepseek]
base_url = "https://api.deepseek.com"
api_key_env = "DEEPSEEK_API_KEY"

[[model]]
id = "devin/claude-haiku-5-5-low"
connector = "devin"
upstream = "claude-haiku-5-5-low"
protocol = "devin"
features = ["images", "thinking"]
aliases = ["devin/haiku"]

[[model]]
id = "opencode/grok-4.7"
connector = "opencode"
upstream = "grok-4.7"
protocol = "responses"
aliases = ["opencode/grok"]

[[model]]
id = "opencode/glm-5.3"
connector = "opencode"
upstream = "glm-5.3"
protocol = "chat"
aliases = ["opencode/glm"]

[[model]]
id = "deepseek/deepseek-flash"
connector = "deepseek"
upstream = "deepseek-flash"
protocol = "chat"
features = ["images", "thinking"]
aliases = ["deepseek/flash"]

[[model]]
id = "deepseek/deepseek-v4-pro"
connector = "deepseek"
upstream = "deepseek-v4-pro"
protocol = "chat"
features = ["thinking"]
aliases = ["deepseek/pro"]

[[route]]
match = "devin/*"
fallbacks = ["opencode/glm-5.3"]

[[route]]
match = "opencode/*"
fallbacks = []

[[route]]
match = "deepseek/*"
fallbacks = []
